[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-miner"
version = "0.1.0"
description = "A SHA-256d Bitcoin miner in pure Python: headers, proof of work, and Stratum v1"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]

[project.scripts]
btcminer = "btcminer.cli:main"

[tool.setuptools]
packages = ["btcminer"]
