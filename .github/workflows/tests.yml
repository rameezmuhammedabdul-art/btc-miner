name: tests

on:
  # Scoped to main: a branch with an open PR is already covered by
  # pull_request, and listing both ran every commit twice.
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor the README promises, a middle version, and the newest.
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No install step: the package and its tests are standard library only.
      - name: Run the test suite
        run: python -m unittest discover -s tests -v

      - name: Re-hash known mainnet blocks
        run: python -m btcminer verify
